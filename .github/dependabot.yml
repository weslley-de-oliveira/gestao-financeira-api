# Atualizações automáticas de dependências: um PR por grupo, toda segunda-feira.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Correções e versões menores juntas; versões maiores, cada uma no seu PR.
      dependencias:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  # Imagem base do Dockerfile (node:26-slim).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    commit-message:
      prefix: build(deps)
