name: Imagem Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build e publicação da imagem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Publica no GitHub Container Registry com o token do próprio workflow.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tag por commit (`sha-<curto>`) sempre; `latest` só na main.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A imagem sobe e responde no /health sem banco (o /ready depende do Postgres).
      - name: Smoke test
        run: |
          docker run -d --name api -p 3333:3333 \
            -e DATABASE_URL=postgres://ninguem:nada@127.0.0.1:1/nenhum \
            -e APP_ORIGIN=https://exemplo.com \
            "${IMAGE}:sha-${GITHUB_SHA::7}"
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3333/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.ref == 'refs/heads/main'
        run: docker push --all-tags "${IMAGE}"

      # O Render não acompanha o registry: o deploy hook (segredo do repositório) pede a nova versão.
      - name: Deploy on Render
        if: github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL não definido: deploy no Render não solicitado."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
