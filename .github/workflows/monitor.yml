name: Monitora a produção

# A cada hora, confere o caminho real de quem visita: o site na Vercel, o rewrite de /api para o
# Render, a API e o banco (/ready) e o login da conta de demonstração. Uma falha deixa a execução
# vermelha, e o GitHub avisa por e-mail.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://gestao-financeira-tau-five.vercel.app

jobs:
  check:
    name: Saúde da API publicada
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # No plano gratuito, o Render hiberna a API: a primeira resposta pode levar quase um minuto.
      - name: API ready (through Vercel)
        run: |
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 \
            "$SITE_URL/api/ready"

      - name: Demo login
        run: |
          status=$(curl -sS -o /tmp/login.json -w '%{http_code}' -c /tmp/cookies.txt \
            --max-time 60 -X POST "$SITE_URL/api/v1/auth/login" \
            -H 'content-type: application/json' -H "origin: $SITE_URL" \
            -d '{"email":"demo@exemplo.com","password":"demo1234"}')
          if [ "$status" != "200" ]; then
            echo "::error::Login da conta de demonstração respondeu $status"
            cat /tmp/login.json
            exit 1
          fi
          # Encerra a sessão aberta pelo monitor.
          curl -fsS -o /dev/null -b /tmp/cookies.txt --max-time 60 \
            -X POST "$SITE_URL/api/v1/auth/logout" -H "origin: $SITE_URL"
